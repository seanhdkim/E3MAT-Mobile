<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E3MAT Mobile</title>

  <style>
    :root {
      --navy: #0b1f3a;
      --blue: #1f5ea8;
      --light-blue: #eaf2fb;
      --border: #cbd5e1;
      --text: #172033;
      --muted: #5d6b82;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #f4f7fb;
    }

    header {
      background: var(--navy);
      color: var(--white);
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    header p {
      margin: 0.3rem 0 0;
      color: #d7e5f6;
      font-size: 0.9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: calc(100vh - 84px);
    }

    nav {
      padding: 1rem;
      background: var(--white);
      border-right: 1px solid var(--border);
    }

    .nav-label {
      margin: 0 0 0.7rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .app-button {
      display: block;
      width: 100%;
      margin-bottom: 0.55rem;
      padding: 0.85rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--white);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .app-button:hover,
    .app-button:focus {
      border-color: var(--blue);
      background: var(--light-blue);
      outline: none;
    }

    .app-button.active {
      border-color: var(--blue);
      background: var(--blue);
      color: var(--white);
    }

    main {
      min-width: 0;
      padding: 1rem;
    }

    .app-frame {
      display: none;
      width: 100%;
      height: calc(100vh - 116px);
      min-height: 650px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--white);
    }

    .app-frame.active {
      display: block;
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
      }

      nav {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .app-button {
        display: inline-block;
        width: auto;
        margin-right: 0.5rem;
      }

      .app-frame {
        height: calc(100vh - 400px);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>E3MAT Mobile</h1>
    <p>Select an application from the navigation panel.</p>
  </header>

  <div class="layout">
    <nav aria-label="Application navigation">
      <p class="nav-label">Applications</p>

      <button class="app-button active" type="button" data-app="telemetry">
        IRIG 106-23 Frequency Separation Calculator
      </button>

      <button class="app-button" type="button" data-app="triangulator">
        RF Interference Triangulator
      </button>

      <button class="app-button" type="button" data-app="heroHerpHirf">
        HERO HERP HIRF
      </button>

      <button class="app-button" type="button" data-app="timeZoneClock">
        Time Zone Clock
      </button>

      <button class="app-button" type="button" data-app="rfFieldCalculator">
        RF Field Calculator
      </button>

      <button class="app-button" type="button" data-app="fresnelZoneCalculator">
        Fresnel Zone Clearance Calculator
      </button>
    </nav>

    <main>
      <iframe
        id="telemetry"
        class="app-frame active"
        title="IRIG 106-23 Frequency Separation Calculator"
        src="IRIG Minimum Frequency Separation Chcek/index.html"
      ></iframe>

      <iframe
        id="triangulator"
        class="app-frame"
        title="RF Interference Triangulator"
        src="Interference Triangulator/index.html"
      ></iframe>

      <iframe
        id="heroHerpHirf"
        class="app-frame"
        title="HERO HERP HIRF"
        src="HERO HERP HIRF/index.html"
      ></iframe>

      <iframe
        id="timeZoneClock"
        class="app-frame"
        title="Time Zone Clock"
        src="Time Zone Clock/index.html"
      ></iframe>

      <iframe
        id="rfFieldCalculator"
        class="app-frame"
        title="RF Field Calculator"
        src="RF Field Calculator/index.html"
      ></iframe>

      <iframe
        id="fresnelZoneCalculator"
        class="app-frame"
        title="Fresnel Zone Clearance Calculator"
        src="Fresnel Zone Clearance Calculator/index.html"
      ></iframe>
    </main>
  </div>

  <script>
    const defaultApp = "telemetry";

    function showApp(appId) {
      const selectedFrame = document.getElementById(appId);

      if (!selectedFrame) {
        appId = defaultApp;
      }

      document.querySelectorAll(".app-frame").forEach((frame) => {
        frame.classList.toggle("active", frame.id === appId);
      });

      document.querySelectorAll(".app-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.app === appId);
      });

      window.location.hash = appId;
    }

    document.querySelectorAll(".app-button").forEach((button) => {
      button.addEventListener("click", () => {
        showApp(button.dataset.app);
      });
    });

    window.addEventListener("DOMContentLoaded", () => {
      const selectedApp = window.location.hash.replace("#", "");

      if (document.getElementById(selectedApp)) {
        showApp(selectedApp);
      } else {
        showApp(defaultApp);
      }
    });

    window.addEventListener("hashchange", () => {
      const selectedApp = window.location.hash.replace("#", "");

      if (document.getElementById(selectedApp)) {
        showApp(selectedApp);
      }
    });
  </script>
</body>
</html>
